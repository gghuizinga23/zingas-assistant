; Zinga's Assistant: Val's activity log, sent to quo-bridge every minute (files/zingas_activity.py)
[program:zingas-activity]
command=/usr/local/bin/zingas-activity run
user=root
environment=HOME="/root",HERMES_HOME="/root/.hermes",ZINGAS_VAULT="/root/Documents/ZingasVault",PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stdout_logfile=/var/log/orgo/zingas-activity.log
stderr_logfile=/var/log/orgo/zingas-activity.err
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=2
