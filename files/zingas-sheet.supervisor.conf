; Zinga's Assistant: Val keeps the Follow-Up sheet filled in (files/zingas_sheet.py, "run")
[program:zingas-sheet]
command=/usr/local/bin/zingas-sheet run
user=root
environment=HOME="/root",HERMES_HOME="/root/.hermes",ZINGAS_VAULT="/root/Documents/ZingasVault",PATH="/usr/local/bin:/root/.local/bin:/root/.hermes/bin:/usr/bin:/bin:/usr/sbin:/sbin",PYTHONPATH="/usr/local/lib/zingas"
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stdout_logfile=/var/log/orgo/zingas-sheet.log
stderr_logfile=/var/log/orgo/zingas-sheet.err
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=2
