; Zinga's Assistant: sends Val's to-do list to the company website's To-do tab (files/zingas_todo.py, "watch")
[program:zingas-todo-post]
command=/usr/local/bin/zingas-todo watch
user=root
environment=HOME="/root",HERMES_HOME="/root/.hermes",ZINGAS_VAULT="/root/Documents/ZingasVault",PATH="/usr/local/bin:/root/.local/bin:/root/.hermes/bin:/usr/bin:/bin:/usr/sbin:/sbin",PYTHONPATH="/usr/local/lib/zingas"
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stdout_logfile=/var/log/orgo/zingas-todo-post.log
stderr_logfile=/var/log/orgo/zingas-todo-post.err
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=2
