; Zinga's Assistant: the thank-you text after Gerrit emails an estimate (files/zingas_thanks.py)
[program:zingas-thanks]
command=/usr/local/bin/zingas-thanks run
user=root
environment=HOME="/root",HERMES_HOME="/root/.hermes",ZINGAS_VAULT="/root/Documents/ZingasVault",PATH="/usr/local/bin:/root/.local/bin:/root/.hermes/bin:/usr/bin:/bin:/usr/sbin:/sbin"
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stdout_logfile=/var/log/orgo/zingas-thanks.log
stderr_logfile=/var/log/orgo/zingas-thanks.err
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=2
