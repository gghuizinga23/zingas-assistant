# Zinga's Assistant: Hermes config, adapted from Nick's Stack (MIT).
#
# What changed from Nick's config, and why:
#   - approvals ON and hooks never auto-accepted. Nothing reaches a customer on
#     the model's say-so; the send gate lives in quo-bridge, in code.
#   - Only the tools this job needs. No payment card, no X/vidiq/ideabrowser,
#     no AgentMail/AgentPhone (customer texts go through Quo via quo-bridge).
#   - Only two chat surfaces: the terminal and Telegram.
#   - The model is Nous Portal pay-as-you-go credits. Never a ChatGPT login
#     (openai-codex): an always-on agent on a consumer login breaks its terms.
#   - Secrets come from the 1Password vault "Zingas Assistant".
model:
  default: anthropic/claude-sonnet-5.5
  provider: nous
  base_url: https://inference-api.nousresearch.com/v1
# Voice bake-off: the Nous sign-in already covers Claude, GPT and Grok, so no
# extra keys. Try each on the same 20 real situations before choosing the default.
agent:
  max_turns: 40
  verify_on_stop: false
  verbose: false
  reasoning_effort: medium
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
browser:
  inactivity_timeout: 120
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  protect_first_n: 3
prompt_caching:
  cache_ttl: 5m
display:
  compact: false
  busy_input_mode: interrupt
  # Gerrit (2026-10-21): no gear/tool lines, no thinking, no in-between
  # messages in Telegram. Only the answer.
  show_reasoning: false
  interim_assistant_messages: false
  streaming: true
  tool_progress: "off"
  long_running_notifications: true
stt:
  # Telegram voice notes (truck debriefs) are transcribed.
  enabled: true
  local:
    model: base
  openai:
    model: whisper-1
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  provider: ''
  nudge_interval: 10
  flush_min_turns: 6
skills:
  creation_nudge_interval: 15
approvals:
  mode: true
  mcp_reload_confirm: true
  destructive_slash_confirm: true
hooks_auto_accept: false
code_execution:
  timeout: 300
  max_tool_calls: 50
updates:
  pre_update_backup: true
  backup_keep: 5
  non_interactive_local_changes: stash
secrets:
  onepassword:
    # Ships disabled, as in Nick's Stack: an enabled map with no token stalls
    # every start. Onboarding flips it on once ~/.hermes/.op.env has the token.
    enabled: false
    # Telegram's bot token stays where Orgo put it (~/.hermes/.env). The AI
    # needs no key: Val signs in to Nous Portal instead.
    # Only fields that already exist in the note. A missing field makes every
    # start retry 1Password, so add each line when its key goes into the note:
    #   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ESTIMATOR_URL,
    #   ESTIMATOR_SERVICE_TOKEN, SF_LOGIN_URL, SF_CLIENT_ID, SF_CLIENT_SECRET
    #   (each as op://Zingas Assistant/Assistant Secrets/<NAME>)
    env:
      HEALTHCHECKS_PING_URL: op://Zingas Assistant/Assistant Secrets/HEALTHCHECKS_PING_URL
      COMPOSIO_VAL_KEY: op://Zingas Assistant/Assistant Secrets/COMPOSIO_VAL_KEY
    binary_path: /usr/bin/op
_config_version: 33
# Briefs at 8:00am and 7:00pm and quiet hours use Gerrit's time, not the server's (UTC).
timezone: America/Indiana/Indianapolis
session_reset:
  mode: both
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
# No tool here can text a customer. Customer texts leave only through
# quo-bridge, after Gerrit taps Approve in the approvals bot.
platform_toolsets:
  # Timed jobs (the briefs). Messaging and clarify are always off for these; the
  # Gmail and notes-vault tool servers are added on top. No terminal or files.
  cron:
    - skills
    - todo
  cli:
    - browser
    - clarify
    - cronjob
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
  telegram:
    - clarify
    - cronjob
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
plugins:
  enabled:
    - anthropic-provider
    - openai
    - openrouter
    - openrouter-provider
    - xai
    - xai-provider
    - web-xai
mcp_servers:
  # Gmail: Composio's locked session (read, search, draft only). The link is
  # COMPOSIO_MAIL_MCP_URL in .env; COMPOSIO_VAL_KEY is Val's limited key from
  # 1Password. Made by files/gmail-setup.sh; checked by files/gmail-safety-check.sh.
  gmail:
    url: ${COMPOSIO_MAIL_MCP_URL}
    headers:
      x-api-key: ${COMPOSIO_VAL_KEY}
    timeout: 120
    tools:
      include: [GMAIL_FETCH_EMAILS, GMAIL_LIST_MESSAGES, GMAIL_LIST_THREADS,
        GMAIL_FETCH_MESSAGE_BY_MESSAGE_ID, GMAIL_FETCH_MESSAGE_BY_THREAD_ID,
        GMAIL_CREATE_EMAIL_DRAFT, GMAIL_LIST_DRAFTS, GMAIL_GET_DRAFT, GMAIL_GET_ATTACHMENT]
      prompts: false
      resources: false
  # Orgo's template adds its own "orgo" server, which can send email, edit the
  # calendar and share Drive with no approval tap. Keep it off.
  orgo:
    enabled: false
  obsidian-vault:
    command: npx
    args:
      - -y
      - '@modelcontextprotocol/server-filesystem'
      - /root/Documents/ZingasVault
    enabled: true
