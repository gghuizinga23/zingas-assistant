; Zinga's Assistant: Val's 10-minute check-in with healthchecks.io (files/heartbeat.sh)
[program:zingas-heartbeat]
command=/usr/local/bin/zingas-assistant-heartbeat
user=root
autostart=true
autorestart=true
stopsignal=TERM
stdout_logfile=/var/log/orgo/zingas-heartbeat.log
stderr_logfile=/var/log/orgo/zingas-heartbeat.err
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=2
