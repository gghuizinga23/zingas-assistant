; Zinga's Assistant: team members' Plaud recordings into their own to-do lists (files/team_plaud.py). Heather first.
; HOME stays /root here; each `plaud` call for a person runs with HOME set to their own folder (/root/people/<name>).
[program:zingas-team-plaud]
command=/usr/local/bin/zingas-team-plaud run
user=root
environment=HOME="/root",HERMES_HOME="/root/.hermes",ZINGAS_VAULT="/root/Documents/ZingasVault",ZINGAS_PEOPLE_HOMES="/root/people",PATH="/usr/local/bin:/root/.local/bin:/root/.hermes/bin:/usr/bin:/bin:/usr/sbin:/sbin",PYTHONPATH="/usr/local/lib/zingas"
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stdout_logfile=/var/log/orgo/zingas-team-plaud.log
stderr_logfile=/var/log/orgo/zingas-team-plaud.err
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=2
