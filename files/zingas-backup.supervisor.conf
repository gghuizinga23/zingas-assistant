; Zinga's Assistant: Val's nightly backup to Backblaze B2, 2:30 AM (files/zingas_backup.py)
[program:zingas-backup]
command=/usr/local/bin/zingas-backup run
user=root
environment=HOME="/root",HERMES_HOME="/root/.hermes",ZINGAS_VAULT="/root/Documents/ZingasVault",PATH="/usr/local/bin:/root/.local/bin:/root/.hermes/bin:/usr/bin:/bin:/usr/sbin:/sbin"
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stdout_logfile=/var/log/orgo/zingas-backup.log
stderr_logfile=/var/log/orgo/zingas-backup.err
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=2
