; Zinga's Assistant: Val learns from what Gerrit changes in her drafts (files/zingas_voice.py, "run")
[program:zingas-voice]
command=/usr/local/bin/zingas-voice run
user=root
environment=HOME="/root",HERMES_HOME="/root/.hermes",ZINGAS_VAULT="/root/Documents/ZingasVault",PATH="/usr/local/bin:/root/.local/bin:/root/.hermes/bin:/usr/bin:/bin:/usr/sbin:/sbin",PYTHONPATH="/usr/local/lib/zingas"
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stdout_logfile=/var/log/orgo/zingas-voice.log
stderr_logfile=/var/log/orgo/zingas-voice.err
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=2
