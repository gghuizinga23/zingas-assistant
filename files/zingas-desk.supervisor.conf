; Zinga's Assistant: Val's desk on the website (files/zingas_desk.py): Needs you, Talk to Val, From Val, Settings
[program:zingas-desk]
command=/usr/local/bin/zingas-desk run
user=root
environment=HOME="/root",HERMES_HOME="/root/.hermes",ZINGAS_VAULT="/root/Documents/ZingasVault",PATH="/usr/local/bin:/root/.local/bin:/root/.hermes/bin:/usr/bin:/bin:/usr/sbin:/sbin"
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stdout_logfile=/var/log/orgo/zingas-desk.log
stderr_logfile=/var/log/orgo/zingas-desk.err
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=2
