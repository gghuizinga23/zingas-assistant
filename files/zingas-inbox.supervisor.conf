; Zinga's Assistant: new work email becomes to-do list tasks (files/zingas_inbox.py)
[program:zingas-inbox]
command=/usr/local/bin/zingas-inbox run
user=root
environment=HOME="/root",HERMES_HOME="/root/.hermes",ZINGAS_VAULT="/root/Documents/ZingasVault",PATH="/usr/local/bin:/root/.local/bin:/root/.hermes/bin:/usr/bin:/bin:/usr/sbin:/sbin"
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stdout_logfile=/var/log/orgo/zingas-inbox.log
stderr_logfile=/var/log/orgo/zingas-inbox.err
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=2
