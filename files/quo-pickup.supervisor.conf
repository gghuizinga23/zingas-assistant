; Zinga's Assistant: picks up customer texts from quo-bridge and asks Val for drafts (files/quo_pickup.py)
[program:zingas-quo-pickup]
command=/usr/local/bin/zingas-quo run
user=root
environment=HOME="/root",HERMES_HOME="/root/.hermes",PATH="/usr/local/bin:/root/.local/bin:/root/.hermes/bin:/usr/bin:/bin:/usr/sbin:/sbin"
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stdout_logfile=/var/log/orgo/zingas-quo-pickup.log
stderr_logfile=/var/log/orgo/zingas-quo-pickup.err
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=2
